name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static website
        env:
          VITE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: |
          npm run build
          test -f dist/index.html
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: './dist'

      - name: Verify uploaded artifact
        run: |
          echo "Uploaded artifact ID: ${{ steps.upload-pages.outputs.artifact_id }}"
          test -n "${{ steps.upload-pages.outputs.artifact_id }}"

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for artifact metadata indexing
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
